name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check jevclient
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check jevclient
