name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Trusted publishing: GitHub mints a short-lived OIDC token that PyPI verifies
    # against the publisher registered for this repo and this workflow file. No API
    # token exists to leak, and renaming this file breaks publishing rather than
    # silently publishing from somewhere else.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # v1.14.2. The SHA the playbook carried predates trusted publishing: it never
      # attempts OIDC, sends an empty password instead, and PyPI answers 403.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          # Underscore. The hyphenated form is silently ignored and a re-upload
          # then fails with HTTP 400.
          skip_existing: true
